<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Offline - UnMess</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background-color: #0f1729; /* App Dark Background */
        color: white;
        height: 100vh; /* Fallback */
        height: 100dvh; /* Dynamic Viewport Height for mobile */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        /* Safe Area Insets */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        overflow: hidden; /* Prevent scroll */
      }

      .container {
        width: 100%;
        max-width: 400px;
        background-color: rgba(26, 35, 50, 0.5); /* #1A2332 with opacity */
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px; /* rounded-3xl */
        padding: 32px;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); /* shadow-2xl */
      }

      .icon {
        font-size: 72px; /* text-7xl */
        margin-bottom: 24px;
        filter: drop-shadow(0 0 10px rgba(157, 71, 222, 0.3));
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      h1 {
        font-size: 30px; /* text-3xl */
        font-weight: 700;
        color: #9d47de;
        margin-bottom: 16px;
      }

      p {
        color: #9ca3af; /* text-gray-400 */
        font-size: 16px;
        line-height: 1.625;
        margin-bottom: 32px;
      }

      .btn {
        display: block;
        width: 100%;
        background-color: #7e22ce;
        color: white;
        text-decoration: none;
        padding: 14px 0;
        border-radius: 12px; /* rounded-xl */
        font-weight: 600;
        font-size: 16px;
        border: none;
        cursor: pointer;
        box-shadow: 0 10px 15px -3px rgba(126, 34, 206, 0.2);
        transition: all 0.2s;
        -webkit-tap-highlight-color: transparent;
      }

      .btn:active {
        transform: scale(0.95);
      }

      .footer {
        position: absolute;
        bottom: 32px;
        font-size: 14px;
        color: #4b5563; /* text-gray-600 */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>You're Offline</h1>
      <p>
        We couldn't verify your session because you are offline. Please check
        your internet connection and try again.
      </p>
      <button onclick="window.location.reload()" class="btn">Try Again</button>
    </div>
    <div class="footer">UnMess App &bull; Offline Mode</div>
  </body>
</html>
